
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatSpace | Account</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: #f4f4f5;
  background: radial-gradient(circle at top, #23325c, #10111b 55%);
}

.card {
  width: 100%;
  max-width: 430px;
  padding: 30px;
  border: 1px solid #34364b;
  border-radius: 20px;
  background: rgba(22, 23, 38, .96);
  box-shadow: 0 20px 70px #0005;
}

.logo {
  text-align: center;
  font-size: 42px;
}

h1 {
  text-align: center;
  margin: 10px 0 8px;
}

.subtitle {
  text-align: center;
  color: #a5a7bd;
  margin-bottom: 24px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
}

button, input {
  font: inherit;
}

.tabs button {
  flex: 1;
  padding: 11px;
  border: 1px solid #3c3e53;
  border-radius: 9px;
  color: #ddd;
  background: #242538;
  cursor: pointer;
}

.tabs button.active {
  background: #6c63ff;
  border-color: #6c63ff;
  color: white;
}

label {
  display: block;
  margin: 14px 0 7px;
  color: #d7d8e6;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #3b3d52;
  border-radius: 9px;
  outline: none;
  color: white;
  background: #11121f;
}

input:focus {
  border-color: #827bff;
}

.primary {
  width: 100%;
  padding: 13px;
  margin-top: 20px;
  border: 0;
  border-radius: 9px;
  background: #6c63ff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.primary:hover {
  background: #8179ff;
}

.primary:disabled {
  opacity: .6;
  cursor: wait;
}

.link {
  display: block;
  margin-top: 16px;
  text-align: center;
  color: #aaa5ff;
  background: none;
  border: 0;
  cursor: pointer;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
  color: #9294ac;
  font-size: 13px;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #3b3d52;
}

.google-area {
  display: flex;
  justify-content: center;
  min-height: 44px;
}

.message {
  display: none;
  margin-top: 16px;
  padding: 12px;
  border-radius: 9px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  background: #292a3d;
}

.message.show {
  display: block;
}

.message.error {
  color: #ffb4b4;
}

.message.success {
  color: #a7f3c0;
}

.panel[hidden] {
  display: none;
}

.small {
  color: #9294ac;
  font-size: 12px;
  line-height: 1.5;
  margin-top: 18px;
}

.hint {
  color: #9294ac;
  font-size: 12px;
  margin-top: 6px;
}
</style>
</head>

<body>

<main class="card">

  <div class="logo">💬</div>

  <h1>ChatSpace</h1>

  <p class="subtitle">Connect with people in real time</p>

  <div class="tabs" id="tabs">
    <button type="button" class="active" data-panel="login">
      Login
    </button>

    <button type="button" data-panel="signup">
      Sign up
    </button>
  </div>

  <!-- LOGIN -->

  <section class="panel" id="login">

    <form id="loginForm">

      <label for="loginIdentifier">
        Username / Email / Mobile Number
      </label>

      <input
        id="loginIdentifier"
        name="identifier"
        type="text"
        placeholder="Enter username, email or mobile"
        autocomplete="username"
        required
      >

      <label for="loginPassword">Password</label>

      <input
        id="loginPassword"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button class="primary" type="submit">
        Login to Chat
      </button>

    </form>

    <div class="divider">OR</div>

    <div class="google-area">
      <div id="googleLoginButton"></div>
    </div>

    <button type="button" class="link" data-panel="forgot">
      Forgot password?
    </button>

  </section>

  <!-- SIGNUP -->

  <section class="panel" id="signup" hidden>

    <form id="signupForm">

      <label for="signupUsername">Username</label>

      <input
        id="signupUsername"
        name="username"
        type="text"
        placeholder="Choose a username"
        autocomplete="username"
        minlength="3"
        maxlength="20"
        pattern="[A-Za-z0-9_]+"
        required
      >

      <label for="signupEmail">Email address</label>

      <input
        id="signupEmail"
        name="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        maxlength="254"
        required
      >

      <label for="signupPhone">Mobile number</label>

      <input
        id="signupPhone"
        name="phone"
        type="tel"
        placeholder="e.g. 9876543210 or +919876543210"
        autocomplete="tel"
        pattern="[+]?[0-9\s()-]{10,16}"
        required
      >

      <p class="hint">Enter your Indian mobile number.</p>

      <label for="signupPassword">
        Password (minimum 8 characters)
      </label>

      <input
        id="signupPassword"
        name="password"
        type="password"
        placeholder="Create a password"
        autocomplete="new-password"
        minlength="8"
        maxlength="72"
        required
      >

      <button class="primary" type="submit">
        Create Account
      </button>

    </form>

    <div class="divider">OR</div>

    <div class="google-area">
      <div id="googleSignupButton"></div>
    </div>

    <p class="hint" style="text-align:center">
      You can also create an account with Google.
    </p>

  </section>

  <!-- FORGOT PASSWORD -->

  <section class="panel" id="forgot" hidden>

    <h2>Forgot password?</h2>

    <p class="subtitle">
      Enter your registered email address.
    </p>

    <form id="forgotForm">

      <label for="forgotEmail">Email address</label>

      <input
        id="forgotEmail"
        name="email"
        type="email"
        autocomplete="email"
        required
      >

      <button class="primary" type="submit">
        Send Reset Link
      </button>

    </form>

    <button type="button" class="link" data-panel="login">
      Back to login
    </button>

  </section>

  <!-- RESET PASSWORD -->

  <section class="panel" id="reset" hidden>

    <h2>Choose a new password</h2>

    <form id="resetForm">

      <label for="resetPassword">New password</label>

      <input
        id="resetPassword"
        name="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        maxlength="72"
        required
      >

      <button class="primary" type="submit">
        Reset Password
      </button>

    </form>

  </section>

  <div id="message" class="message" role="status"
       aria-live="polite"></div>

  <p class="small">
    Keep your password private. Never share verification or reset links.
  </p>

</main>

<script>

const $ = (id) => document.getElementById(id);

const messageBox = $("message");

let resetToken = new URLSearchParams(location.search).get("reset");

function showMessage(text, type = "success") {
  messageBox.textContent = text;
  messageBox.className = `message show ${type}`;
}

function clearMessage() {
  messageBox.textContent = "";
  messageBox.className = "message";
}

function showPanel(name) {

  document.querySelectorAll(".panel").forEach(panel => {
    panel.hidden = panel.id !== name;
  });

  $("tabs").hidden = name === "forgot" || name === "reset";

  document.querySelectorAll("#tabs button").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.panel === name
    );
  });

  clearMessage();
}

document.querySelectorAll("[data-panel]").forEach(button => {
  button.addEventListener("click", () => {
    showPanel(button.dataset.panel);
  });
});

async function api(url, data) {

  const response = await fetch(url, {
    method: "POST",
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  });

  const result = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(result.error || "Request failed.");
  }

  return result;
}

// GOOGLE SIGN-IN

async function handleGoogleCredential(response) {

  clearMessage();

  try {

    const result = await api("/api/auth/google", {
      credential: response.credential
    });

    showMessage("Google Sign-In successful!");

    location.href = "/chat";

  } catch (error) {

    showMessage(error.message, "error");

  }
}

window.handleGoogleCredential = handleGoogleCredential;

// Render both Google buttons after Google's script loads.

function initializeGoogleButtons() {

  if (!window.google?.accounts?.id) {
    return false;
  }

  const clientId =
    "524584060968-661c0gmmn6hh9elf029hf119e5m5qcs3.apps.googleusercontent.com";

  google.accounts.id.initialize({
    client_id: clientId,
    callback: handleGoogleCredential,
    auto_select: false
  });

  const options = {
    type: "standard",
    theme: "outline",
    size: "large",
    text: "continue_with",
    shape: "rectangular",
    width: 300
  };

  google.accounts.id.renderButton(
    $("googleLoginButton"),
    options
  );

  google.accounts.id.renderButton(
    $("googleSignupButton"),
    options
  );

  return true;
}

const googleScriptCheck = setInterval(() => {

  if (initializeGoogleButtons()) {
    clearInterval(googleScriptCheck);
  }

}, 300);

// SIGNUP

$("signupForm").addEventListener("submit", async (event) => {

  event.preventDefault();

  const button = event.submitter;
  button.disabled = true;

  try {

    const data = Object.fromEntries(
      new FormData(event.currentTarget)
    );

    const result = await api("/api/auth/signup", data);

    showPanel("login");

    showMessage(
      result.message ||
      "Account created. Check your email to verify it."
    );

    $("loginIdentifier").value = data.username;

  } catch (error) {

    showMessage(error.message, "error");

  } finally {

    button.disabled = false;

  }

});

// NORMAL LOGIN

$("loginForm").addEventListener("submit", async (event) => {

  event.preventDefault();

  const button = event.submitter;
  button.disabled = true;

  try {

    const data = Object.fromEntries(
      new FormData(event.currentTarget)
    );

    await api("/api/auth/login", data);

    location.href = "/chat";

  } catch (error) {

    showMessage(error.message, "error");

  } finally {

    button.disabled = false;

  }

});

// FORGOT PASSWORD

$("forgotForm").addEventListener("submit", async (event) => {

  event.preventDefault();

  const button = event.submitter;
  button.disabled = true;

  try {

    const data = Object.fromEntries(
      new FormData(event.currentTarget)
    );

    const result = await api(
      "/api/auth/forgot-password",
      data
    );

    showMessage(result.message);

  } catch (error) {

    showMessage(error.message, "error");

  } finally {

    button.disabled = false;

  }

});

// RESET PASSWORD

$("resetForm").addEventListener("submit", async (event) => {

  event.preventDefault();

  const button = event.submitter;
  button.disabled = true;

  try {

    const password = $("resetPassword").value;

    const result = await api(
      "/api/auth/reset-password",
      {
        token: resetToken,
        password
      }
    );

    history.replaceState({}, "", "/");

    resetToken = null;

    showPanel("login");

    showMessage(result.message);

  } catch (error) {

    showMessage(error.message, "error");

  } finally {

    button.disabled = false;

  }

});

// CHECK EXISTING SESSION AND RESET LINK

async function checkPage() {

  if (resetToken) {
    showPanel("reset");
    return;
  }

  try {

    const response = await fetch("/api/auth/me", {
      credentials: "same-origin"
    });

    if (response.ok) {
      location.href = "/chat";
      return;
    }

  } catch (error) {
    console.log("Session check failed:", error.message);
  }

  showPanel("login");

}

checkPage();

</script>

</body>
</html>
