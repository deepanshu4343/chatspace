
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatSpace</title>

<style>
:root {
  --bg:#080f18;
  --panel:#111b27;
  --sidebar:#101923;
  --border:#253443;
  --accent:#25d5b2;
  --text:#e8f0f5;
  --muted:#8b9ba9;
  --bubble:#202f3c;
  --mine:#075e50;
  --header:#111d28;
  --input:#202c38;
}

body.light {
  --bg:#e8eef2;
  --panel:#ffffff;
  --sidebar:#f5f8fa;
  --border:#d8e0e6;
  --accent:#008f78;
  --text:#18232d;
  --muted:#667783;
  --bubble:#e7edf1;
  --mine:#d0f5e9;
  --header:#f5f8fa;
  --input:#edf2f5;
}

* {box-sizing:border-box}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

button,input,textarea {font:inherit}
button {cursor:pointer}

.app {
  display:flex;
  max-width:1500px;
  height:100dvh;
  margin:auto;
  background:var(--panel);
  overflow:hidden;
}

aside {
  width:340px;
  flex-shrink:0;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
}

.side-header {
  padding:18px;
  border-bottom:1px solid var(--border);
}

.top-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.logo {font-size:25px;font-weight:bold}
.accent {color:var(--accent)}

.icon-btn {
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  border-radius:9px;
  padding:8px 11px;
}

.profile {
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar {
  width:43px;
  height:43px;
  border-radius:50%;
  background:#23483f;
  display:grid;
  place-items:center;
  font-weight:bold;
  color:#b4ffe9;
  flex-shrink:0;
}

.profile-info {min-width:0}
.profile-name {font-weight:bold;overflow-wrap:anywhere}

.status {
  color:var(--accent);
  font-size:12px;
  margin-top:4px;
}

.logout {
  margin-left:auto;
  background:transparent;
  border:1px solid var(--border);
  color:var(--muted);
  border-radius:8px;
  padding:8px;
}

.search-wrap {padding:12px}

.search {
  width:100%;
  padding:12px;
  background:var(--input);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);
  outline:none;
}

.contact-heading {
  padding:8px 16px;
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
}

#contacts {
  list-style:none;
  margin:0;
  padding:0;
  overflow-y:auto;
  flex:1;
}

.contact {
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 16px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.contact:hover,.contact.active {background:var(--input)}

.contact-info {flex:1;min-width:0}
.contact-name {font-weight:bold;overflow-wrap:anywhere}
.contact-status {color:var(--muted);font-size:12px;margin-top:5px}

.online-dot {
  width:9px;
  height:9px;
  border-radius:50%;
  background:#35d58b;
  margin-left:auto;
  flex-shrink:0;
}

.offline-dot {
  width:9px;
  height:9px;
  border-radius:50%;
  background:#87939c;
  margin-left:auto;
  flex-shrink:0;
}

.unread {
  background:var(--accent);
  color:#06241e;
  border-radius:20px;
  padding:3px 7px;
  font-size:11px;
  font-weight:bold;
}

main {
  display:flex;
  flex-direction:column;
  flex:1;
  min-width:0;
  background:var(--panel);
}

header {
  min-height:76px;
  display:flex;
  align-items:center;
  padding:12px 18px;
  gap:12px;
  background:var(--header);
  border-bottom:1px solid var(--border);
}

#chatTitle {font-size:17px;font-weight:bold}
#chatStatus {color:var(--muted);font-size:12px;margin-top:5px}

.back {
  display:none;
  background:transparent;
  border:0;
  color:var(--text);
  font-size:23px;
}

.header-actions {margin-left:auto;display:flex;gap:8px}

#messages {
  flex:1;
  overflow-y:auto;
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:12px;
  scroll-behavior:smooth;
}

.empty {
  margin:auto;
  text-align:center;
  color:var(--muted);
  line-height:1.8;
}

.message {
  max-width:min(78%,620px);
  align-self:flex-start;
}

.message.mine {align-self:flex-end}

.meta {
  color:var(--muted);
  font-size:11px;
  margin:0 5px 5px;
}

.bubble {
  padding:11px 14px;
  border-radius:5px 14px 14px;
  background:var(--bubble);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.5;
}

.message.mine .bubble {
  background:var(--mine);
  border-radius:14px 5px 14px 14px;
}

.message.pending .bubble {opacity:.75}

.message-status {
  text-align:right;
  font-size:10px;
  color:var(--muted);
  margin-top:4px;
}

#typing {
  min-height:20px;
  padding:0 22px;
  color:var(--accent);
  font-size:12px;
}

.composer {
  padding:12px;
  display:flex;
  gap:9px;
  align-items:center;
  background:var(--header);
  border-top:1px solid var(--border);
}

#input {
  flex:1;
  min-width:0;
  resize:none;
  height:46px;
  max-height:120px;
  padding:13px 16px;
  border:1px solid var(--border);
  border-radius:23px;
  background:var(--input);
  color:var(--text);
  outline:none;
}

#send {
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:var(--accent);
  color:#06241e;
  font-size:20px;
  font-weight:bold;
}

#send:disabled {opacity:.5;cursor:not-allowed}

.emoji-wrap {position:relative}

#emojiPanel {
  display:none;
  position:absolute;
  bottom:55px;
  left:0;
  width:220px;
  padding:10px;
  background:var(--header);
  border:1px solid var(--border);
  border-radius:12px;
  grid-template-columns:repeat(6,1fr);
  gap:5px;
  box-shadow:0 5px 20px #0005;
  z-index:5;
}

#emojiPanel button {
  background:transparent;
  border:0;
  padding:6px;
  font-size:20px;
  border-radius:6px;
}

#emojiPanel button:hover {background:var(--input)}

#toast {
  position:fixed;
  bottom:85px;
  left:50%;
  transform:translateX(-50%);
  background:#172b35;
  color:white;
  padding:11px 17px;
  border-radius:10px;
  display:none;
  z-index:10;
  box-shadow:0 4px 15px #0005;
  max-width:90%;
  text-align:center;
}

#messageSearch {
  display:none;
  padding:10px 14px;
  background:var(--header);
  border-bottom:1px solid var(--border);
}

#messageSearch input {
  width:100%;
  padding:10px;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:9px;
}

@media(max-width:650px) {
  .app {position:relative}
  aside {width:100%;border-right:0}
  main {display:none;width:100%}
  .app.chat-open aside {display:none}
  .app.chat-open main {display:flex}
  .back {display:block}
  #messages {padding:14px}
  .message {max-width:90%}
  .side-header {padding:14px}
}
</style>
</head>

<body>
<div class="app" id="app">

<aside>
  <div class="side-header">
    <div class="top-row">
      <div class="logo">Chat<span class="accent">Space</span></div>
      <button class="icon-btn" id="themeButton" title="Change theme">☀️</button>
    </div>

    <div class="profile">
      <div class="avatar" id="myAvatar">?</div>
      <div class="profile-info">
        <div class="profile-name" id="myName">Loading...</div>
        <div class="status" id="myStatus">● Online</div>
      </div>
      <button class="logout" id="logout">Logout</button>
    </div>
  </div>

  <div class="search-wrap">
    <input class="search" id="search"
      placeholder="Search online contacts..."
      autocomplete="off">
  </div>

  <div class="contact-heading">Conversations</div>
  <ul id="contacts">
    <li class="contact">Loading contacts...</li>
  </ul>
</aside>

<main>
  <header>
    <button class="back" id="back">←</button>
    <div class="avatar" id="chatAvatar">C</div>
    <div>
      <div id="chatTitle">General Chat</div>
      <div id="chatStatus">Community conversation</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="generalButton" title="General chat">🏠</button>
      <button class="icon-btn" id="searchMessagesButton" title="Search messages">🔎</button>
    </div>
  </header>

  <div id="messageSearch">
    <input id="messageSearchInput" placeholder="Find text in this conversation...">
  </div>

  <div id="messages" aria-live="polite">
    <div class="empty">Welcome to ChatSpace!<br>Start a conversation.</div>
  </div>

  <div id="typing"></div>

  <form class="composer" id="form">
    <div class="emoji-wrap">
      <button type="button" class="icon-btn" id="emojiButton">😊</button>
      <div id="emojiPanel"></div>
    </div>

    <textarea id="input" maxlength="1000"
      placeholder="Type a message..."
      autocomplete="off" required></textarea>

    <button id="send" type="submit" disabled>➤</button>
  </form>
</main>
</div>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>

<script>
const $ = id => document.getElementById(id);

const app = $("app");
const contacts = $("contacts");
const messages = $("messages");
const input = $("input");
const form = $("form");
const search = $("search");

const myName = $("myName");
const myAvatar = $("myAvatar");
const chatTitle = $("chatTitle");
const chatStatus = $("chatStatus");
const chatAvatar = $("chatAvatar");
const typing = $("typing");
const sendButton = $("send");

let currentUser = null;
let socket = null;
let selectedUsername = null;
let onlineList = [];
let unread = {};
let typingTimer = null;
let generalHistory = [];
let pendingPrivate = [];
let toastTimer = null;

function avatarLetter(name) {
  return (name || "?").charAt(0).toUpperCase();
}

function showToast(text) {
  const toast = $("toast");
  toast.textContent = text;
  toast.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 2600);
}

function scrollBottom() {
  messages.scrollTop = messages.scrollHeight;
}

function clearMessages() {
  messages.replaceChildren();
}

function showEmpty(text) {
  clearMessages();
  const div = document.createElement("div");
  div.className = "empty";
  div.textContent = text;
  messages.appendChild(div);
}

function formatTime(value) {
  if (!value) return new Date().toLocaleTimeString([], {
    hour:"2-digit", minute:"2-digit"
  });

  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);

  return date.toLocaleTimeString([], {
    hour:"2-digit", minute:"2-digit"
  });
}

function showMessage(data, mine, status = "") {
  if (!data || typeof data.text !== "string") return null;

  const item = document.createElement("div");
  item.className = "message" + (mine ? " mine" : "");

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent =
    (data.username || data.from || (mine ? "You" : "User")) +
    " · " + formatTime(data.time || data.created_at);

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = data.text;

  item.append(meta, bubble);

  if (status) {
    const statusElement = document.createElement("div");
    statusElement.className = "message-status";
    statusElement.textContent = status;
    item.appendChild(statusElement);
  }

  messages.appendChild(item);
  scrollBottom();
  return item;
}

function renderGeneralHistory() {
  clearMessages();

  if (!generalHistory.length) {
    showEmpty("Welcome! Start the community conversation.");
    return;
  }

  generalHistory.forEach(message => {
    showMessage(
      message,
      message.username === currentUser.username
    );
  });
}

function renderContacts() {
  contacts.replaceChildren();

  const query = search.value.toLowerCase();

  const filtered = onlineList.filter(user =>
    user.id !== String(currentUser.id) &&
    user.username.toLowerCase().includes(query)
  );

  filtered.forEach(user => {
    const li = document.createElement("li");
    li.className = "contact";

    if (selectedUsername === user.username) {
      li.classList.add("active");
    }

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = avatarLetter(user.username);

    const info = document.createElement("div");
    info.className = "contact-info";

    const name = document.createElement("div");
    name.className = "contact-name";
    name.textContent = user.username;

    const status = document.createElement("div");
    status.className = "contact-status";
    status.textContent = "Online";

    info.append(name, status);
    li.append(avatar, info);

    if (unread[user.username]) {
      const badge = document.createElement("span");
      badge.className = "unread";
      badge.textContent = unread[user.username];
      li.appendChild(badge);
    }

    const dot = document.createElement("span");
    dot.className = "online-dot";
    li.appendChild(dot);

    li.addEventListener("click", () => openPrivateChat(user.username));
    contacts.appendChild(li);
  });

  if (!filtered.length) {
    const li = document.createElement("li");
    li.className = "contact";
    li.textContent = "No online contacts found.";
    contacts.appendChild(li);
  }
}

function openGeneralChat() {
  if (selectedUsername && socket?.connected) {
    socket.emit("stop typing", {to:selectedUsername});
  }

  selectedUsername = null;
  typing.textContent = "";
  unread = {...unread};

  chatTitle.textContent = "General Chat";
  chatAvatar.textContent = "C";
  chatStatus.textContent = "Community conversation";

  app.classList.add("chat-open");
  renderContacts();
  renderGeneralHistory();
  input.focus();
}

function openPrivateChat(username) {
  if (!socket?.connected) {
    showToast("Connecting to ChatSpace. Please wait.");
    return;
  }

  if (selectedUsername && socket.connected) {
    socket.emit("stop typing", {to:selectedUsername});
  }

  selectedUsername = username;
  unread[username] = 0;

  chatTitle.textContent = username;
  chatAvatar.textContent = avatarLetter(username);

  const isOnline = onlineList.some(
    user => user.username === username
  );
  chatStatus.textContent = isOnline ? "Online" : "Offline";

  typing.textContent = "";
  app.classList.add("chat-open");
  renderContacts();
  showEmpty("Loading conversation...");

  socket.emit("get private history", {username});
  input.focus();
}

function handlePrivateHistory(data) {
  if (!data || data.username !== selectedUsername) return;

  clearMessages();

  if (!Array.isArray(data.messages) || !data.messages.length) {
    showEmpty("No messages yet. Say hello!");
    return;
  }

  data.messages.forEach(message => {
    showMessage(message, message.mine === true);
  });
}

function handlePrivateMessage(message) {
  if (!message || typeof message.text !== "string") return;

  if (selectedUsername === message.from) {
    showMessage(message, false);
  } else {
    unread[message.from] = (unread[message.from] || 0) + 1;
    renderContacts();

    if ("Notification" in window &&
        Notification.permission === "granted") {
      new Notification("New ChatSpace message", {
        body: message.from + ": " + message.text
      });
    }
  }
}

function handleSentMessage(message) {
  if (!message || typeof message.text !== "string") return;

  // The message is already shown immediately when Send is pressed.
  // Update its pending status instead of displaying it a second time.
  const index = pendingPrivate.findIndex(item =>
    item.text === message.text &&
    item.username === selectedUsername
  );

  if (index !== -1) {
    const pending = pendingPrivate.splice(index, 1)[0];
    pending.element.classList.remove("pending");

    const status = pending.element.querySelector(".message-status");
    if (status) status.textContent = "Sent";
  }
}

function handlePrivateError(data) {
  showToast(data?.error || "Private message failed.");
}

function addPrivateOptimisticMessage(text) {
  const element = showMessage({
    text,
    username: currentUser.username,
    time: new Date()
  }, true, "Sending...");

  element.classList.add("pending");

  pendingPrivate.push({
    text,
    username:selectedUsername,
    element
  });
}

async function start() {
  try {
    const response = await fetch("/api/auth/me", {
      credentials:"same-origin"
    });

    if (!response.ok) {
      window.location.href = "/";
      return;
    }

    const data = await response.json();
    currentUser = data.user;

    myName.textContent = currentUser.username;
    myAvatar.textContent = avatarLetter(currentUser.username);

    socket = io({withCredentials:true});

    socket.on("connect", () => {
      chatStatus.textContent = selectedUsername
        ? "Connected"
        : "Community conversation";

      sendButton.disabled = false;
      $("myStatus").textContent = "● Online";
    });

    socket.on("connect_error", error => {
      chatStatus.textContent = "Connection error";
      sendButton.disabled = true;
      showToast("Connection problem. Reconnecting...");
      console.error(error);
    });

    socket.on("disconnect", () => {
      chatStatus.textContent = "Reconnecting...";
      sendButton.disabled = true;
      $("myStatus").textContent = "● Reconnecting";
    });

    socket.on("chat history", history => {
      if (!Array.isArray(history)) return;

      generalHistory = history.slice();

      if (selectedUsername === null) {
        renderGeneralHistory();
      }
    });

    socket.on("chat message", message => {
      if (!message || typeof message.text !== "string") return;

      generalHistory.push(message);
      if (generalHistory.length > 200) generalHistory.shift();

      if (selectedUsername === null) {
        showMessage(
          message,
          message.username === currentUser.username
        );
      }
    });

    socket.on("online users", list => {
      onlineList = Array.isArray(list) ? list : [];
      renderContacts();

      if (selectedUsername) {
        const isOnline = onlineList.some(
          user => user.username === selectedUsername
        );

        chatStatus.textContent = isOnline ? "Online" : "Offline";
      }
    });

    socket.on("private history", handlePrivateHistory);
    socket.on("private message", handlePrivateMessage);
    socket.on("private message sent", handleSentMessage);
    socket.on("private message error", handlePrivateError);

    socket.on("user typing", data => {
      if (data?.username === selectedUsername) {
        typing.textContent = data.username + " is typing...";
      }
    });

    socket.on("user stopped typing", data => {
      if (data?.username === selectedUsername) {
        typing.textContent = "";
      }
    });

    sendButton.disabled = true;

  } catch (error) {
    console.error(error);
    chatStatus.textContent = "Could not load your account.";
    showToast("Could not load ChatSpace.");
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();

  const text = input.value.trim();

  if (!text) return;

  if (!socket?.connected) {
    showToast("Not connected. Please wait.");
    return;
  }

  if (selectedUsername) {
    const recipient = selectedUsername;

    socket.emit("stop typing", {to:recipient});

    // Show the message immediately instead of waiting for the server.
    addPrivateOptimisticMessage(text);

    socket.emit("private message", {
      to:recipient,
      text
    });

  } else {
    // General chat messages are displayed when the server broadcasts them.
    socket.emit("chat message", {text});
  }

  input.value = "";
  input.style.height = "46px";
  input.focus();
});

input.addEventListener("input", () => {
  input.style.height = "46px";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";

  if (!selectedUsername || !socket?.connected) return;

  socket.emit("typing", {to:selectedUsername});

  clearTimeout(typingTimer);

  typingTimer = setTimeout(() => {
    socket.emit("stop typing", {to:selectedUsername});
  }, 1200);
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

search.addEventListener("input", renderContacts);

$("back").addEventListener("click", () => {
  app.classList.remove("chat-open");
});

$("generalButton").addEventListener("click", openGeneralChat);

$("logout").addEventListener("click", async () => {
  if (!confirm("Are you sure you want to log out?")) return;

  try {
    await fetch("/api/auth/logout", {
      method:"POST",
      credentials:"same-origin"
    });

    window.location.href = "/";
  } catch (error) {
    showToast("Logout failed. Please try again.");
  }
});

// Theme switch
const themeButton = $("themeButton");

function applyTheme(theme) {
  document.body.classList.toggle("light", theme === "light");
  themeButton.textContent = theme === "light" ? "🌙" : "☀️";
}

let savedTheme = "dark";
try {
  savedTheme = localStorage.getItem("chatspace-theme") || "dark";
} catch (error) {}

applyTheme(savedTheme);

themeButton.addEventListener("click", () => {
  const next = document.body.classList.contains("light")
    ? "dark"
    : "light";

  applyTheme(next);

  try {
    localStorage.setItem("chatspace-theme", next);
  } catch (error) {}
});

// Emoji picker
const emojiList = [
  "😀","😁","😂","🤣","😊","😍",
  "🥰","😘","😎","😭","😢","😡",
  "👍","👎","👏","🙏","❤️","🔥",
  "🎉","💯","🤝","😴","🤔","🙌"
];

const emojiPanel = $("emojiPanel");

emojiList.forEach(emoji => {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = emoji;

  button.addEventListener("click", () => {
    input.value += emoji;
    input.focus();
    emojiPanel.style.display = "none";
  });

  emojiPanel.appendChild(button);
});

$("emojiButton").addEventListener("click", () => {
  emojiPanel.style.display =
    emojiPanel.style.display === "grid" ? "none" : "grid";
});

// Search messages in the currently visible conversation
const messageSearch = $("messageSearch");
const messageSearchInput = $("messageSearchInput");

$("searchMessagesButton").addEventListener("click", () => {
  const visible = messageSearch.style.display === "block";
  messageSearch.style.display = visible ? "none" : "block";
  if (!visible) messageSearchInput.focus();
});

messageSearchInput.addEventListener("input", () => {
  const query = messageSearchInput.value.toLowerCase();

  [...messages.querySelectorAll(".message")].forEach(item => {
    item.style.display = item.textContent.toLowerCase().includes(query)
      ? ""
      : "none";
  });
});

// Ask for browser notifications only after the user chooses to interact.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden &&
      "Notification" in window &&
      Notification.permission === "default") {
    // Notifications remain optional; no permission prompt is forced.
  }
});

start();
</script>
</body>
</html>
